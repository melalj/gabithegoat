# Builds the image SimHost's Dokploy runs: ghcr.io/melalj/gabithegoat:<commit sha>
# on every push to master (also :latest).
name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/melalj/gabithegoat:${{ github.sha }}
            ghcr.io/melalj/gabithegoat:latest
          labels: org.opencontainers.image.source=https://github.com/melalj/gabithegoat
